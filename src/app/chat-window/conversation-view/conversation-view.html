<section class="chat-conversation-container">

    @for (message of activeChatMessagesSignal(); track message.id) {

        @if (message.role === 'user'){
        <div class="message" [class.user]="message.role === 'user'">
            <div class="message-bubble">{{message.content}}</div>
        </div>
        }
        @else if (message.role === 'assistant') {
        <div class="message" [class.assistant]="message.role === 'assistant'">
            <div class="message-bubble" [innerHTML]="message.content"></div>
        </div>
        }

    }

    <span [hidden]="!modelGeneratingSignal()">{{modelReplySignal()}}</span>
</section>
<app-message-input></app-message-input>
